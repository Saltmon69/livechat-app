<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100vw; height: 100vh;
  background: transparent;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}

#overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  visibility: hidden;
}

#overlay.show { visibility: visible; }

/* === LAYOUT AVEC MÉDIA === */
#overlay.has-media #sender {
  position: fixed;
  top: 24px;
  left: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
}

#overlay.has-media #media-wrap {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
}

#overlay.has-media #text-el {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: 90vw;
  text-align: center;
}

/* === LAYOUT SANS MÉDIA (texte seul / audio) === */
#overlay.no-media #sender {
  position: fixed;
  top: 24px;
  left: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
}

#overlay.no-media #text-el {
  position: fixed;
  top: 90px;
  left: 24px;
  max-width: 60vw;
  text-align: left;
}

/* === SENDER === */
#avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #fff;
  display: none;
}

#username {
  font-size: 20px;
  font-weight: 800;
  color: white;
  text-shadow:
    -2px -2px 0 #000, 2px -2px 0 #000,
    -2px  2px 0 #000, 2px  2px 0 #000;
  display: none;
}

/* === MÉDIA === */
#media-wrap { display: none; }

#media-img {
  display: block;
  max-width: 85vw;
  max-height: 50vh;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 8px;
}

#media-vid {
  display: block;
  max-width: 85vw;
  max-height: 50vh;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 8px;
}

/* === TEXTE === */
#text-el {
  font-size: 28px;
  font-weight: 800;
  color: white;
  line-height: 1.3;
  word-break: break-word;
  text-shadow:
    -2px -2px 0 #000, 2px -2px 0 #000,
    -2px  2px 0 #000, 2px  2px 0 #000,
    0 -2px 0 #000, 0 2px 0 #000,
    -2px 0 0 #000, 2px 0 0 #000;
  display: none;
}
</style>
</head>
<body>

<div id="overlay">
  <div id="sender">
    <img id="avatar" src="" alt="">
    <span id="username"></span>
  </div>

  <div id="media-wrap">
    <img id="media-img" src="" alt="">
    <video id="media-vid" playsinline></video>
  </div>

  <div id="text-el"></div>
</div>
<audio id="audio-el"></audio>

<script>
const { ipcRenderer } = require('electron');

const overlay  = document.getElementById('overlay');
const avatarEl = document.getElementById('avatar');
const unameEl  = document.getElementById('username');
const mediaWrap= document.getElementById('media-wrap');
const imgEl    = document.getElementById('media-img');
const vidEl    = document.getElementById('media-vid');
const textEl   = document.getElementById('text-el');
const audioEl  = document.getElementById('audio-el');

let hideTimer = null;
let mediaDoneSent = false;

function hide() {
  overlay.classList.remove('show');
  vidEl.pause();
  vidEl.src = '';
  imgEl.src = '';
  audioEl.pause();
  audioEl.src = '';
  if (!mediaDoneSent) {
    mediaDoneSent = true;
    ipcRenderer.invoke('media-done').catch(() => {});
  }
}

function show(msg) {
  if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
  mediaDoneSent = false;

  const { username, avatar, text, url, mediaType, defaultDuration, volume } = msg;
  const vol = typeof volume === 'number' ? volume : 1;

  // Sender
  if (avatar) { avatarEl.src = avatar; avatarEl.style.display = 'block'; } 
  else { avatarEl.style.display = 'none'; }
  if (username) { unameEl.textContent = username; unameEl.style.display = 'block'; } 
  else { unameEl.style.display = 'none'; }

  // Texte
  if (text) { textEl.textContent = text; textEl.style.display = 'block'; } 
  else { textEl.style.display = 'none'; }

  imgEl.style.display = 'none';
  vidEl.style.display = 'none';
  mediaWrap.style.display = 'none';

  const hasMedia = url && mediaType !== 'audio';
  overlay.classList.remove('has-media', 'no-media');
  overlay.classList.add(hasMedia ? 'has-media' : 'no-media');
  overlay.classList.add('show');

  if (url) {
    if (mediaType === 'video') {
      mediaWrap.style.display = 'flex';
      vidEl.style.display = 'block';
      vidEl.volume = vol;
      vidEl.src = url;
      vidEl.load();

      vidEl.onloadedmetadata = () => {
        const dur = vidEl.duration;
        if (dur <= 5) {
          let plays = 0;
          vidEl.play();
          vidEl.onended = () => {
            plays++;
            if (plays < 2) { vidEl.currentTime = 0; vidEl.play(); }
            else { hideTimer = setTimeout(hide, 300); }
          };
        } else {
          vidEl.play();
          vidEl.onended = () => { hideTimer = setTimeout(hide, 300); };
        }
      };
      hideTimer = setTimeout(() => { if (!vidEl.duration) hide(); }, 35000);

    } else if (mediaType === 'gif') {
      mediaWrap.style.display = 'flex';
      imgEl.style.display = 'block';
      imgEl.src = url;
      hideTimer = setTimeout(hide, Math.min(defaultDuration * 1000, 30000));

    } else if (mediaType === 'audio') {
      audioEl.volume = vol;
      audioEl.src = url;
      audioEl.load();
      audioEl.play();
      audioEl.onended = () => { hideTimer = setTimeout(hide, 300); };
      audioEl.onerror = () => { hideTimer = setTimeout(hide, defaultDuration * 1000); };

    } else {
      // image
      mediaWrap.style.display = 'flex';
      imgEl.style.display = 'block';
      imgEl.src = url;
      hideTimer = setTimeout(hide, defaultDuration * 1000);
    }
  } else {
    hideTimer = setTimeout(hide, defaultDuration * 1000);
  }
}

ipcRenderer.on('show-media', (_, msg) => show(msg));
</script>
</body>
</html>
