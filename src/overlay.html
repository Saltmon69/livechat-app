<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100vw; height: 100vh;
  background: transparent;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}

#overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  visibility: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#overlay.show { visibility: visible; }

#center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  max-width: 90vw;
}

#sender {
  display: flex;
  align-items: center;
  align-self: flex-start;
  gap: 10px;
  margin-bottom: 4px;
}

#avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #23a55a;
  display: none;
}

#username {
  font-size: 20px;
  font-weight: 800;
  color: white;
  text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
  display: none;
}

#media-img {
  display: block;
  max-width: 85vw;
  max-height: 50vh;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 8px;
}

#media-vid {
  display: block;
  max-width: 85vw;
  max-height: 50vh;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 8px;
}

#text-el {
  font-size: 28px;
  font-weight: 800;
  color: white;
  text-align: center;
  max-width: 85vw;
  line-height: 1.3;
  word-break: break-word;
  text-shadow:
    -2px -2px 0 #000, 2px -2px 0 #000,
    -2px  2px 0 #000, 2px  2px 0 #000,
    0 -2px 0 #000, 0 2px 0 #000,
    -2px 0 0 #000, 2px 0 0 #000;
  display: none;
}
</style>
</head>
<body>

<div id="overlay">
  <div id="center">
    <div id="sender">
      <img id="avatar" src="" alt="">
      <span id="username"></span>
    </div>
    <img id="media-img" src="" alt="" style="display:none">
    <video id="media-vid" playsinline style="display:none"></video>
    <div id="text-el"></div>
  </div>
</div>
<audio id="audio-el"></audio>

<script>
const { ipcRenderer } = require('electron');

const overlay  = document.getElementById('overlay');
const avatarEl = document.getElementById('avatar');
const unameEl  = document.getElementById('username');
const imgEl    = document.getElementById('media-img');
const vidEl    = document.getElementById('media-vid');
const textEl   = document.getElementById('text-el');
const audioEl  = document.getElementById('audio-el');

let hideTimer = null;
let mediaDoneSent = false;

function hide() {
  overlay.classList.remove('show');
  vidEl.pause();
  vidEl.src = '';
  imgEl.src = '';
  audioEl.pause();
  audioEl.src = '';
  if (!mediaDoneSent) {
    mediaDoneSent = true;
    ipcRenderer.invoke('media-done').catch(() => {});
  }
}

function show(msg) {
  if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
  mediaDoneSent = false;

  const { username, avatar, text, url, mediaType, defaultDuration, volume } = msg;
  const vol = typeof volume === 'number' ? volume : 1;

  avatarEl.style.display = avatar ? 'block' : 'none';
  if (avatar) avatarEl.src = avatar;
  unameEl.style.display = username ? 'block' : 'none';
  if (username) unameEl.textContent = username;

  textEl.style.display = text ? 'block' : 'none';
  if (text) textEl.textContent = text;

  imgEl.style.display = 'none';
  vidEl.style.display = 'none';

  overlay.classList.add('show');

  if (url) {
    if (mediaType === 'video') {
      vidEl.style.display = 'block';
      vidEl.volume = vol;
      vidEl.src = url;
      vidEl.load();
      vidEl.onloadedmetadata = () => {
        vidEl.play();
        vidEl.onended = () => { hideTimer = setTimeout(hide, 300); };
      };
      hideTimer = setTimeout(() => { if (!vidEl.duration) hide(); }, 35000);

    } else if (mediaType === 'audio') {
      audioEl.volume = vol;
      audioEl.src = url;
      audioEl.load();
      audioEl.play();
      audioEl.onended = () => { hideTimer = setTimeout(hide, 300); };
      audioEl.onerror = () => { hideTimer = setTimeout(hide, defaultDuration * 1000); };

    } else {
      imgEl.style.display = 'block';
      imgEl.src = url;
      hideTimer = setTimeout(hide, Math.min(defaultDuration * 1000, 30000));
    }
  } else {
    hideTimer = setTimeout(hide, defaultDuration * 1000);
  }
}

ipcRenderer.on('show-media', (_, msg) => show(msg));
ipcRenderer.on('stop-media', () => hide());
</script>
</body>
</html>
